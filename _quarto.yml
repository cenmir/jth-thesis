project:
  type: book
  output-dir: _output

book:
  title: "JTH Thesis Template"
  subtitle: "A quarto template for the modern age of thesis writing"
  author:
    - "First Author"
    - "Second Author"
  date: 2026-05-15
  date-format: "MMMM YYYY"
  chapters:
    - index.qmd
    - preface.qmd
    - abbreviations.qmd
    - introduction.ipynb
    - theory.ipynb
    - methodology.ipynb
    - results.ipynb
    - analysis.ipynb
    - discussion.ipynb
    - conclusions.ipynb
    - references.qmd
  appendices:
    - appendix.qmd

# Custom metadata propagated to titlepage.tex.
thesis-type: "Master Thesis"
programme: "Industrial Product Realisation"
university: "Jönköping University"
school: "School of Engineering"
department: "Department of Product Development, Production and Design"
examiner: "Name of the examiner"
supervisor: "Name of the supervisor"
scope: "30 credits (second cycle)"
date-signed: "2026-05-XX"

format:
  pdf:
    documentclass: scrreprt
    classoption:
      - 11pt
      - twoside
    papersize: a4
    geometry:
      - top=30mm
      - bottom=30mm
      - inner=20mm
      - outer=20mm
    linestretch: 1.3
    number-sections: true
    toc: false
    # The custom title page in before-body.tex emits its own TOC,
    # so Pandoc's automatic one is suppressed here.
    toc-depth: 3
    # \listoffigures and \listoftables are emitted manually in
    # before-body.tex so they sit on roman-numbered front-matter pages,
    # alongside the TOC. Leave lof/lot off here to avoid duplicates.
    lof: false
    lot: false
    colorlinks: true
    link-citations: true
    link-bibliography: true
    linkcolor: NavyBlue
    citecolor: NavyBlue
    urlcolor: NavyBlue
    include-in-header: preamble.tex
    template-partials:
      - before-body.tex
      - title.tex
    fig-pos: "H"
    top-level-division: chapter

bibliography: references.bib
# Default style: IEEE numeric ([1], [2], ...). Math- and engineering-heavy
# theses usually prefer IEEE. For author-date style, switch to apa-7th.csl.
csl: ieee.csl

execute:
  eval: false
  echo: true
